# Any value here can be overridden on the command line, e.g.
#   mvn test -Ddevice.name=emulator-5556 -Dappium.server.url=http://127.0.0.1:4724

appium.server.url = http://127.0.0.1:4723

platform.name   = Android
automation.name = UiAutomator2
device.name     = Android Emulator
# optional: pin to a specific device/emulator serial from `adb devices`
device.udid     =

app.package  = io.appium.android.apis
app.activity = .ApiDemos

# Absolute path to app-debug.apk. Leave blank to drive the copy already
# installed on the device (faster; the suite then assumes it is present).
app.path =

no.reset   = true
full.reset = false

# Stop the app when a scenario finishes, so the emulator is left on the
# launcher. Set to false to leave the app on screen for poking at after a
# failure: mvn test -Dclose.app.after.scenario=false
close.app.after.scenario = true

# seconds
new.command.timeout = 120
element.timeout     = 15
